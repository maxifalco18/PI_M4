name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySpark needs a JVM to run the local SparkSession used in tests/conftest.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies
        run: pip install pyspark==3.5.1 pytest

      - name: Run unit tests (Silver / Gold logic)
        run: python -m pytest -v
